name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One job, named `build`, deliberately — matching rackctl/rackctl. The ruleset's
  # required status check names a job, so everything that must gate belongs inside
  # this one. A second job would be advisory until somebody remembered to add it to
  # ruleset 20081129, and an advisory gate on a repo with a no-bypass ruleset is
  # just a slower way of not having one.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Install the checkout as a REAL directory. Never `ln -s`.
      #
      # A symlinked tap silently suppresses `brew audit`'s RuboCop integration.
      # Measured on this formula, same checkout both ways: symlinked reports 1
      # problem where a real directory reports 2. Nothing errors — audit runs and
      # exits with a plausible count — so a symlinking job is a green gate that
      # never read part of the formula. Reproduced independently on nanohype's tap.
      - name: Install the checkout as a real tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/rackctl/homebrew-tap"
          mkdir -p "$(dirname "${tap_dir}")"
          cp -R "${GITHUB_WORKSPACE}" "${tap_dir}"

      # ---- Gating steps -------------------------------------------------------
      # These are the checks this repo can honestly enforce today. Everything the
      # linters currently flag is generated by goreleaser and unfixable from here,
      # so lint runs advisory below rather than blocking a bump PR on a finding the
      # tap has no power to resolve.

      # The functional gate, and the thing this repo previously had none of: proof
      # that the artifact the formula points at actually installs and executes.
      # sha256 pinning is integrity, not verification — it proves you fetched the
      # bytes someone published, not that those bytes run.
      - name: brew install
        run: brew install rackctl/tap/rackctl

      - name: Verify the installed binary executes
        run: rackctl version

      # `brew install` above exercises only this runner's platform, so exactly one
      # of the four declared SHA256s is covered by it. The other three ship
      # asserted-but-unchecked without this step.
      - name: Verify all declared checksums against the published release
        run: ./script/verify-checksums.sh rackctl.rb

      # ---- Advisory steps -----------------------------------------------------
      # Both linters are red today on two findings, BOTH generator-side:
      #
      #   1. `version 0.4.0 is redundant with version scanned from URL`
      #      Structural and permanent. goreleaser's brews template emits `version`
      #      unconditionally on every release. Red WITHOUT --strict and WITHOUT
      #      --online, so dropping a flag does not get you green. Reproduced on a
      #      second tap (nanohype), so it is a property of the toolchain, not of
      #      this formula.
      #
      #   2. `Description shouldn't start with an article` (rackctl.rb:6)
      #      Already fixed upstream in rackctl/rackctl's .goreleaser.yaml, but the
      #      tap only receives it when the NEXT release regenerates rackctl.rb.
      #
      # FOLLOW-UP: once the next release lands, finding 2 disappears and the
      # formula gains the `test do` block core added. At that point promote these
      # three steps to gating with `brew audit --except=version` and add the
      # `build` context to ruleset 20081129 if it is not already there.
      #
      # `brew style` is kept a SEPARATE step from `brew audit` on purpose: it is
      # not subject to the symlink suppression described above, so the two together
      # cover two independent cop sources.
      - name: brew style (advisory)
        continue-on-error: true
        run: brew style rackctl/tap/rackctl

      - name: brew audit (advisory)
        continue-on-error: true
        run: brew audit --strict rackctl/tap/rackctl

      # Positional, NOT `--formula` — only `brew install` accepts that flag, and
      # `brew test --formula <f>` dies on `invalid option`. Advisory until the next
      # release regenerates the formula with the `test do` block.
      - name: brew test (advisory)
        continue-on-error: true
        run: brew test rackctl/tap/rackctl
